[package]
name = "exam-runner"
description = "PROCTOR exam runner: sits a secret exam against a candidate model inside an OutLayer enclave"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "exam-runner"
path = "src/main.rs"

[dependencies]
proctor-core = { path = "../proctor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"
