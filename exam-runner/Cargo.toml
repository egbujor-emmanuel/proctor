[package]
name = "exam-runner"
description = "PROCTOR exam runner: sits a secret exam against a candidate model inside an OutLayer enclave"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "exam-runner"
path = "src/main.rs"

[dependencies]
proctor-core = { path = "../proctor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }

[target.'cfg(target_os = "wasi")'.dependencies]
# Async HTTP for WASI 0.2 from the Bytecode Alliance (the wasmtime team), so
# questions can be asked concurrently.
wstd = "0.6.8"
# Reads a reply under a hard byte cap (already in the tree through wstd).
http-body-util = "0.1.5"
