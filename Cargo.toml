[workspace]
resolver = "2"
members = ["proctor-core", "exam-runner", "bench"]
exclude = ["contracts/registry", "contracts/mock-outlayer", "contracts/sandbox-tests"]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
