name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Unit tests and clippy (core, runner, bench, registry, escrow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            contracts/registry
            contracts/escrow
      - name: Grading core and exam runner
        run: cargo test --workspace
      - name: Registry contract
        run: cargo test
        working-directory: contracts/registry
      - name: Escrow contract
        run: cargo test
        working-directory: contracts/escrow
      - name: Exam runner builds for OutLayer (wasm32-wasip2)
        run: cargo build -p exam-runner --target wasm32-wasip2 --release
      # Each crate is linted for the target it ships to: the runner's HTTP
      # code exists only on WASI, so a native non-test build would see it as unused.
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy -p proctor-core -p proctor-bench --all-targets -- -D warnings
          cargo clippy -p exam-runner --tests -- -D warnings
          cargo clippy -p exam-runner --target wasm32-wasip2 --release -- -D warnings
      - name: Clippy, registry contract (tests and on-chain build)
        working-directory: contracts/registry
        run: |
          cargo clippy --tests -- -D warnings
          RUSTFLAGS="--cfg near" cargo clippy --target wasm32-unknown-unknown --release -- -D warnings
      - name: Clippy, escrow contract (tests and on-chain build)
        working-directory: contracts/escrow
        run: |
          cargo clippy --tests -- -D warnings
          RUSTFLAGS="--cfg near" cargo clippy --target wasm32-unknown-unknown --release -- -D warnings

  runner-build:
    name: Exam runner release build (reproducible, hash-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-wasip2
      - name: Build with remapped paths
        id: build
        run: |
          bash scripts/build-runner.sh > build.out
          echo "sha256=$(tail -1 build.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: exam-runner-${{ steps.build.outputs.sha256 }}
          path: target/wasm32-wasip2/release/exam-runner.wasm
          if-no-files-found: error
      - name: Hash matches the pinned release
        run: |
          expected="$(cut -d' ' -f1 exam-runner/RELEASE.sha256)"
          echo "built:    ${{ steps.build.outputs.sha256 }}"
          echo "expected: $expected"
          test "${{ steps.build.outputs.sha256 }}" = "$expected"

  registry-build:
    name: Registry contract release build (hash-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Build with remapped paths
        id: build
        run: |
          bash scripts/build-registry.sh > build.out
          echo "sha256=$(tail -1 build.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: proctor-registry-${{ steps.build.outputs.sha256 }}
          path: contracts/registry/target/near/proctor_registry.wasm
          if-no-files-found: error
      - name: Hash matches the pinned release
        run: |
          expected="$(cut -d' ' -f1 contracts/registry/RELEASE.sha256)"
          echo "built:    ${{ steps.build.outputs.sha256 }}"
          echo "expected: $expected"
          test "${{ steps.build.outputs.sha256 }}" = "$expected"

  escrow-build:
    name: Escrow contract release build (hash-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Build with remapped paths
        id: build
        run: |
          bash scripts/build-escrow.sh > build.out
          echo "sha256=$(tail -1 build.out)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: proctor-escrow-${{ steps.build.outputs.sha256 }}
          path: contracts/escrow/target/near/proctor_escrow.wasm
          if-no-files-found: error
      - name: Hash matches the pinned release
        run: |
          expected="$(cut -d' ' -f1 contracts/escrow/RELEASE.sha256)"
          echo "built:    ${{ steps.build.outputs.sha256 }}"
          echo "expected: $expected"
          test "${{ steps.build.outputs.sha256 }}" = "$expected"

  mcp:
    name: MCP server (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Surprise re-test picker and payout quote
        run: node --test ../scripts/retest/pick.test.mjs ../scripts/payout-quote.test.mjs ../scripts/evidence.test.mjs

  demo-agent:
    name: Demo agent Worker (typecheck, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  sentinel:
    name: Sentinel Worker (typecheck, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sentinel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  web:
    name: Website (typecheck, lint, tests, static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sandbox:
    name: Sandbox tests (registry on a local NEAR node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            contracts/registry
            contracts/mock-outlayer
            contracts/sandbox-tests
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Build contracts and runner
        run: bash scripts/build-contracts.sh
      - name: Run sandbox tests
        run: cargo test -- --test-threads=2 --nocapture
        working-directory: contracts/sandbox-tests
